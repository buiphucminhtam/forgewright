approval_policy = "never"
sandbox_mode = "danger-full-access"
[features]
hooks = true

[hooks]

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact|fork"
[[hooks.SessionStart.hooks]]
type = "command"
command = '''bash -c 'root="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 0; command -v python3 >/dev/null 2>&1 || exit 0; script="$root/scripts/memory/native_hook.py"; [ -f "$script" ] || exit 0; FORGEWRIGHT_MEMORY_QUERY="${FORGEWRIGHT_MEMORY_QUERY-memory lifecycle resource native hook decision blocker handoff}" exec python3 "$script" --workspace "$root"' '''
timeout = 3
statusMessage = "Loading optional scoped memory"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = '''bash -c 'root="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 0; command -v python3 >/dev/null 2>&1 || exit 0; script="$root/scripts/memory/native_hook.py"; [ -f "$script" ] || exit 0; FORGEWRIGHT_MEMORY_CAPTURE="${FORGEWRIGHT_MEMORY_CAPTURE-1}" exec python3 "$script" --workspace "$root"' '''
timeout = 3
statusMessage = "Saving optional structured memory"

[[hooks.UserPromptSubmit]]
matcher = "*"
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "bash -c 'root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || exit 0; command -v python3 >/dev/null 2>&1 || exit 0; python3 \"$root/scripts/lite/rule-context-hook.py\" --workspace \"$root\" --platform CODEX --event UserPromptSubmit || true'"
command_windows = '''powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$root = (& git rev-parse --show-toplevel 2>$null | Select-Object -First 1); if (-not $root) { exit 0 }; & (Join-Path $root 'scripts/lite/codex-hook-windows.ps1') -EventName UserPromptSubmit -ProjectRoot $root; exit $LASTEXITCODE"'''
timeout = 2

[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"
[[hooks.SessionStart.hooks]]
type = "command"
command = "bash -c 'root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || exit 0; [ -n \"$root\" ] || exit 0; command -v python3 >/dev/null 2>&1 || exit 0; script=\"$root/scripts/lite/rule-context-hook.py\"; [ -f \"$script\" ] || exit 0; python3 \"$script\" --workspace \"$root\" --platform CODEX --event SessionStart || true'"
command_windows = '''powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$root = (& git rev-parse --show-toplevel 2>$null | Select-Object -First 1); if (-not $root) { exit 0 }; & (Join-Path $root 'scripts/lite/codex-hook-windows.ps1') -EventName SessionStart; exit $LASTEXITCODE"'''
timeout = 2

[[hooks.SubagentStart]]
matcher = "*"
[[hooks.SubagentStart.hooks]]
type = "command"
command = "bash -c 'root=\"$(git rev-parse --show-toplevel 2>/dev/null)\" || exit 0; [ -n \"$root\" ] || exit 0; command -v python3 >/dev/null 2>&1 || exit 0; script=\"$root/scripts/lite/rule-context-hook.py\"; [ -f \"$script\" ] || exit 0; python3 \"$script\" --workspace \"$root\" --platform CODEX --event SubagentStart || true'"
command_windows = '''powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$root = (& git rev-parse --show-toplevel 2>$null | Select-Object -First 1); if (-not $root) { exit 0 }; & (Join-Path $root 'scripts/lite/codex-hook-windows.ps1') -EventName SubagentStart; exit $LASTEXITCODE"'''
timeout = 2

[[hooks.Stop]]
matcher = "*"
[[hooks.Stop.hooks]]
type = "command"
command = '''bash -c 'root="$(git rev-parse --show-toplevel 2>/dev/null)" || exit 1; cd "$root" || exit 1; exec bash scripts/lite/stop-gate.sh --platform CODEX' '''
command_windows = '''powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$root = (& git rev-parse --show-toplevel 2>$null | Select-Object -First 1); if (-not $root) { Write-Error 'Forgewright project root is unavailable.'; exit 1 }; & (Join-Path $root 'scripts/lite/codex-hook-windows.ps1') -EventName Stop; exit $LASTEXITCODE"'''
