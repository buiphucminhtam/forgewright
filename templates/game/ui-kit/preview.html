<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Game UI kit states</title><link rel="stylesheet" href="./tokens.css"><style>body{margin:0;background:#081524;color:#f3f6ec;font:16px system-ui}main{position:relative;min-height:80vh;max-width:960px;margin:auto}h1,p{padding:0 1rem}#events{overflow-wrap:anywhere}</style><h1>Game UI kit</h1><p>Functional state gallery. Apply your approved project theme and inspect over actual gameplay.</p><main></main><p id="events" aria-live="polite">Ready</p><script type="module">
import {createGameUIKit} from './index.js';
const kit=createGameUIKit(document.querySelector('main'),{tokens:{},actions:{onAction:(id,value)=>document.querySelector('#events').textContent=`${id}: ${String(value??'activated')}`}});
kit.render({screen:'gallery',components:[...['default','pressed','focus','disabled','loading','error'].map(state=>({id:state,kind:'button',label:state,state})),{id:'panel',kind:'panel',label:'Mission: collect three signals'},{id:'tab',kind:'tab',label:'Levels',selected:true},{id:'sound',kind:'toggle',label:'Sound',value:true},{id:'volume',kind:'slider',label:'Volume',value:.5,min:0,max:1,step:.1},{id:'energy',kind:'progress',label:'Energy',value:.6,max:1},{id:'hint',kind:'tooltip',label:'Use arrow keys or touch controls'},{id:'saved',kind:'toast',label:'Settings saved'},{id:'icon',kind:'icon',label:'Open settings'}]});
window.addEventListener('pagehide',()=>kit.dispose(),{once:true});
</script></html>
