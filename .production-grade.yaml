# Senior is the default competence/communication baseline for every role.
codingLevel: 8

expertMode:
  enabled: true
  activeCli: "codex"
  fallbackCli: null
  useFor:
    planning: false
    failedPlanReview: true
    gates: true
    securityReview: true
    architectureReview: true
    codeReview: true
  budget:
    maxExpertCallsPerRun: 12
    requireConfirmationAbove: 3

# Native Codex subagent routing. These values are preferences; apply them only
# when the active spawn_agent schema advertises the exact model and effort.
subagents:
  codex:
    # Owner-approved 2026-11-17: gpt-6.1-sol does the main work, gpt-6.1-terra
    # the chores, gpt-6-astra plans and reviews.
    default:
      model: "gpt-6.1-sol"
      reasoning_effort: "medium"
    tiers:
      scout: { model: "gpt-6.1-terra", reasoning_effort: "low" }
      builder: { model: "gpt-6.1-sol", reasoning_effort: "medium" }
      expert: { model: "gpt-6.1-sol", reasoning_effort: "high" }
      planner: { model: "gpt-6-astra", reasoning_effort: "high" }
      reviewer: { model: "gpt-6-astra", reasoning_effort: "high" }
    agent_types:
      explorer: { model: "gpt-6.1-terra", reasoning_effort: "low" }
      worker: { model: "gpt-6.1-sol", reasoning_effort: "medium" }
  claude:
    # Claude Code Agent tool: tier -> plugin agent (model pinned in agents/*.md
    # frontmatter) plus a model alias that is passed only when the active
    # Agent tool schema advertises it; otherwise the parent model is inherited.
    tiers:
      scout: { agent: "forgewright-scout", model: "haiku" }
      builder: { agent: "forgewright-builder", model: "sonnet" }
      expert: { agent: "forgewright-expert", model: "opus" }
      planner: { agent: "forgewright-planner", model: "fable" }
      reviewer: { agent: "forgewright-reviewer", model: "fable" }

token_tracking:
  enabled: true
  log_dir: "~/.forgewright/usage"
  export_format: jsonl
delegationMode:
  enabled: on
  worker:
    cli: pi
    provider: openai-codex
    model: gpt-6.1-sol
    authSource: codex
